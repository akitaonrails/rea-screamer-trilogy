[package]
name = "screamer-launcher"
version = "0.6.0"
edition.workspace = true
rust-version = "1.95"
license.workspace = true
description = "Runs the user's own copy of Screamer, Screamer 2, and Screamer Rally (1995-1997, PC) on modern Linux and Windows"

[[bin]]
name = "ScreamerLauncher"
path = "src/main.rs"

[dependencies]
rea-launcher.workspace = true
# The settings window; it turns on eframe's x11/wayland backends on Linux.
rea-launcher-ui.workspace = true
eframe = { version = "0.37", default-features = false, features = ["glow"] }

[target.'cfg(windows)'.dependencies]
rea-launcher-win32.workspace = true

[dev-dependencies]
png = "0.18"
