[package]
name = "screamer-launcher"
version = "0.8.4"
edition.workspace = true
rust-version = "1.95"
license.workspace = true
description = "Runs the user's own copy of Screamer, Screamer 2, and Screamer Rally (1995-1997, PC) on modern Linux and Windows"

[[bin]]
name = "ScreamerLauncher"
path = "src/main.rs"

[dependencies]
rea-launcher.workspace = true
rea-launcher-ui.workspace = true
# Everywhere: its `report::Audience` (who sees a message) is pure and
# decides the native Linux build's messages too; the Win32 calls are
# Windows-only inside it.
rea-launcher-win32.workspace = true

[build-dependencies]
# Version information, icon and manifest in ScreamerLauncher.exe (build.rs).
rea-launcher-build.workspace = true

[dev-dependencies]
# Headless GUI tests (egui_kittest through AccessKit; no window, no GPU).
rea-launcher-ui = { workspace = true, features = ["testing"] }
png = "0.18"
