[package]
name = "screamer-launcher"
version = "0.5.0"
edition.workspace = true
rust-version = "1.95"
license.workspace = true
description = "Runs the user's own copy of Screamer, Screamer 2, and Screamer Rally (1995-1997, PC) on modern Linux and Windows"

[[bin]]
name = "ScreamerLauncher"
path = "src/main.rs"

[dependencies]
sha2.workspace = true
eframe = { version = "0.37", default-features = false, features = ["glow", "x11", "wayland"] }

[target.'cfg(windows)'.dependencies]
jpeg-decoder = { version = "0.3", default-features = false }

[target.'cfg(windows)'.dependencies.windows-sys]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
png = "0.18"
