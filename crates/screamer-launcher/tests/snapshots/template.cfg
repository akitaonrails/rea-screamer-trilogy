# Screamer Trilogy (Screamer / Screamer 2 / Screamer Rally) launcher
# settings.
#
# One setting per line as key = value; lines starting with # are comments. A
# setting left out uses the launcher's default. Command-line flags (--game,
# --which, --resolution, ...) override this file for one run; --game and
# --which are remembered.

# Which game of the trilogy Play starts. On the command line also 1, 2 or
# rally.
# Values: screamer, screamer2 or screamer-rally.
#which = screamer

# The folder with your Screamer game, or a folder holding two or three of
# them. It is only read, never changed.
# Values: a folder or file.
#game =

# Where your saves, choices and replays are kept between sessions.
# Values: a folder or file.
#saves =

# Where the launcher keeps its private, writable copy of the game.
# Values: a folder or file.
#runtime =

# A different dosbox-staging program to run the game with, instead of the
# bundled one.
# Values: a folder or file.
#dosbox =

# Which of the game's own graphics programs runs. Auto picks the best one
# the game has.
# Values: auto, 3dfx, svga16, svga8 or vga.
#renderer = auto

# Window size (WIDTHxHEIGHT), fullscreen, or original for the 4:3 1280×960
# window.
# Values: WIDTHxHEIGHT, original, off, fullscreen, full or desktop.
#resolution = 1920x1080

# On a 16:9 screen, shows more to the sides instead of stretching the
# picture.
# Values: on or off.
#widescreen = on

# Scenery and cars appear farther ahead, so less pops in.
# Values: on or off.
#extended_draw_distance = on

# Shows 100 frames per second by adding a blended frame between each of the
# game's 50; the game itself runs as always. Experimental.
# Values: on or off.
#frame_generation = off

# Waits for the screen's refresh, so the picture never tears.
# Values: on or off.
#vsync = on

# How the game's picture is enlarged: CRT look, FSR, crisp pixels or smooth.
# Values: original, fsr, sharp or smooth.
#texture_filter = sharp

# Analog steering, trigger pedals and rumble from a modern gamepad.
# Values: on or off.
#gamepad_axes = on

# How far the stick moves before the car steers, in percent (the game had
# 8).
# Values: 0 to 30.
#deadzone = 0

# How strongly the gamepad rumbles when you brake hard, 0 to 100.
# Values: 0 to 100.
#rumble = 60

# Gamepad buttons: modern, original, or 8 button numbers (accelerate, back,
# camera, gear down, brake, gear up, select, start).
# Values: text.
#buttons = modern

# Linux: how gamescope enlarges the game to the screen (read by
# screamer-play).
# Values: nearest, pixel, fsr or linear.
#scaler = fsr
