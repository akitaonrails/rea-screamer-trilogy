[workspace]
members = ["crates/screamer-launcher", "crates/screamer-hooks"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
sha2 = "0.11.1"
windows-sys = "0.61"

[profile.release.package.screamer-hooks]
opt-level = 3

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
strip = true
