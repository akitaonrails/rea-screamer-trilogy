name: Unknown edition
description: "ScreamerLauncher said your Screamer, Screamer 2 or Screamer Rally executable is a build it does not know."
title: "Unknown edition: "
labels: ["edition"]
body:
  - type: markdown
    attributes:
      value: |
        The launcher only changes builds it has identified by SHA-256, so it left yours alone and
        did not use it. Tell us about your copy: a build we can verify is added. Some builds
        need a fix written for that exact file, so we may ask more about your copy first.
        Never attach or link game files.
  - type: dropdown
    id: game
    attributes:
      label: Game
      options: [Screamer (1995), Screamer 2 (1996), Screamer Rally (1997)]
    validations:
      required: true
  - type: textarea
    id: sha256
    attributes:
      label: The message with the file name and SHA-256
      description: >-
        Copy it from the window or from `ScreamerLauncher --check --game <folder>` (also in
        launcher.log). A SHA-256 is 64 characters, digits 0-9 and letters a-f.
      render: text
    validations:
      required: true
  - type: input
    id: size
    attributes:
      label: File size in bytes
      description: Properties on Windows, or `stat -c %s STARTH.EXE` (the file's name) on Linux.
  - type: dropdown
    id: source
    attributes:
      label: Where is your copy of the game from?
      options:
        - Original CD
        - GOG
        - A budget or compilation re-release
        - Patched by hand (official or community patch)
        - Not sure
    validations:
      required: true
  - type: input
    id: details
    attributes:
      label: Version, language and country
      description: e.g. "Italian CD, 1997".
  - type: input
    id: version
    attributes:
      label: Launcher version
      description: The first line of `ScreamerLauncher --help`, e.g. "ScreamerLauncher 0.6.0".
  - type: textarea
    id: log
    attributes:
      label: launcher.log
      description: |
        Optional. Next to launcher.cfg (Windows `%APPDATA%\ScreamerLauncher\`, Linux
        `~/.config/screamer-launcher/`). Remove personal paths before posting.
      render: text
