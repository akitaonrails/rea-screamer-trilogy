name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.95.0

jobs:
  linux-packages:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl file libasound2-dev libgl1-mesa-dev libopusfile-dev libpng-dev \
            libsdl2-dev libspeexdsp-dev libwayland-dev libxkbcommon-dev \
            meson ninja-build patchelf pkg-config xz-utils zip zlib1g-dev
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_VERSION"
      - name: Test and lint
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          sh linux/tests/gpu-env.sh
          sh linux/tests/scaler.sh
          sh linux/tests/supervision.sh
      - name: Dependency advisories, licenses, and sources
        run: |
          cargo install --locked cargo-audit@0.22.1 cargo-deny@0.19.8
          cargo audit
          cargo deny check
      - name: Build launcher and bundled DOSBox
        run: |
          ./scripts/build-dosbox.sh
          cargo build --release --workspace --locked
      - name: Package Linux zip and AppImage
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' crates/screamer-launcher/Cargo.toml | head -1)"
          name="ScreamerLauncher-v${version}"
          package="dist/${name}-linux-x86_64"
          mkdir -p "$package/lib"
          cp target/release/ScreamerLauncher target/release/dosbox \
             README.md CHANGELOG.md THIRD_PARTY.md LICENSE-MIT LICENSE-APACHE "$package/"
          cp -r target/release/resources "$package/resources"
          cp -r linux "$package/linux"
          cp sdk/rea-play.sh "$package/linux/rea-play.sh"
          for binary in "$package/ScreamerLauncher" "$package/dosbox"; do
            while read -r libpath; do
              case "$(basename "$libpath")" in
                libSDL2*|libopus*|libogg*|libspeexdsp*|libpng*|libz-ng*)
                  cp -L "$libpath" "$package/lib/"
                  ;;
              esac
            done < <(ldd "$binary" | awk '/=> \// {print $3}')
            patchelf --set-rpath '$ORIGIN/lib' "$binary"
          done
          (cd dist && zip -r "${name}-linux-x86_64.zip" "${name}-linux-x86_64")
          packaging/appimage/build.sh "$package" dist/appimage
          mv dist/appimage/ScreamerLauncher-x86_64.AppImage "dist/${name}-x86_64.AppImage"
          echo "LINUX_ZIP=dist/${name}-linux-x86_64.zip" >> "$GITHUB_ENV"
          echo "APPIMAGE=dist/${name}-x86_64.AppImage" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ScreamerLauncher-linux
          path: |
            ${{ env.LINUX_ZIP }}
            ${{ env.APPIMAGE }}
          if-no-files-found: error

  windows-packages:
    name: Windows x86_64
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-ntldd
            mingw-w64-x86_64-opusfile
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-rust
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-speexdsp
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-zlib
            zip
      - name: Build launcher and bundled DOSBox
        run: |
          rustc --version
          cargo build --release --workspace --locked
          git -C vendor/dosbox-staging apply ../../patches/dosbox-staging-screamer-hooks.patch
          meson setup target/dosbox-staging-build vendor/dosbox-staging \
            -Dbuildtype=release \
            -Ddefault_library=shared \
            -Dtry_static_libs=iir \
            -Duse_sdl2_net=false \
            -Duse_mt32emu=false \
            -Duse_slirp=false \
            -Duse_fluidsynth=false \
            -Duse_zlib_ng=false \
            -Dunit_tests=disabled
          ninja -C target/dosbox-staging-build dosbox.exe
      - name: Package Windows zip
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' crates/screamer-launcher/Cargo.toml | head -1)"
          name="ScreamerLauncher-v${version}"
          package="$PWD/dist/${name}-windows-x86_64"
          mkdir -p "$package"
          (cd vendor/dosbox-staging && scripts/create-package.sh -p msys2 -f \
            "$OLDPWD/target/dosbox-staging-build" "$package")
          cp target/release/ScreamerLauncher.exe \
             README.md CHANGELOG.md THIRD_PARTY.md LICENSE-MIT LICENSE-APACHE "$package/"
          (
            set +o pipefail
            ntldd -R "$package/ScreamerLauncher.exe" \
              | sed -e 's/^[[:blank:]]*//g' \
              | cut -d ' ' -f 3 \
              | grep -E -i '(mingw|clang)(32|64)' \
              | sed -e 's|\\|/|g' \
              | {
                  copy_status=0
                  while IFS= read -r dll; do
                    cp "$dll" "$package/" || copy_status=$?
                  done
                  exit "$copy_status"
                }
          )
          (cd dist && zip -r "${name}-windows-x86_64.zip" "${name}-windows-x86_64")
          echo "WINDOWS_ZIP=dist/${name}-windows-x86_64.zip" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ScreamerLauncher-windows
          path: ${{ env.WINDOWS_ZIP }}
          if-no-files-found: error

  source-archive:
    name: Corresponding source
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - name: Create recursive source archive
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' crates/screamer-launcher/Cargo.toml | head -1)"
          name="ScreamerLauncher-v${version}-source"
          mkdir -p dist
          tar --exclude-vcs --exclude='./target' --exclude='./dist' \
            --transform="s,^\./,${name}/," -cJf "dist/${name}.tar.xz" .
          echo "SOURCE_TAR=dist/${name}.tar.xz" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ScreamerLauncher-source
          path: ${{ env.SOURCE_TAR }}
          if-no-files-found: error

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-packages, windows-packages, source-archive]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify tag matches package version
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' crates/screamer-launcher/Cargo.toml | head -1)"
          test "$GITHUB_REF_NAME" = "v${version}"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ScreamerLauncher-*
          merge-multiple: true
          path: dist
      - name: Create checksums
        run: (cd dist && sha256sum *.zip *.AppImage *.tar.xz > SHA256SUMS)
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: |
            dist/*.zip
            dist/*.AppImage
            dist/*.tar.xz
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --verify-tag
          --generate-notes
