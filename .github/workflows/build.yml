name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-packages:
    name: Linux x86_64
    uses: akitaonrails/rea-launcher-sdk/.github/workflows/launcher-ci.yml@v0.3.0
    with:
      concurrency-key: linux
      # The older glibc keeps the native binaries running on older distros.
      runs-on: ubuntu-22.04
      rust-toolchain: 1.95.0
      # Native Linux build (no cross target); the Windows build is below.
      rust-target: ""
      submodules: recursive
      apt-packages: >-
        curl file libasound2-dev libgl1-mesa-dev libopusfile-dev libpng-dev
        libsdl2-dev libspeexdsp-dev libwayland-dev libxkbcommon-dev
        meson ninja-build patchelf pkg-config xz-utils zip unzip zlib1g-dev
      package-command: |
        ./scripts/build-dosbox.sh
        version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' crates/screamer-launcher/Cargo.toml | head -1)"
        name="ScreamerLauncher-v${version}"
        package="dist/${name}-linux-x86_64"
        mkdir -p "$package/lib"
        cp target/release/ScreamerLauncher target/release/dosbox \
           README.md CHANGELOG.md THIRD_PARTY.md LICENSE-MIT LICENSE-APACHE "$package/"
        cp -r target/release/resources "$package/resources"
        cp -r linux "$package/linux"
        cp "$REA_SDK/rea-play.sh" "$package/linux/rea-play.sh"
        for binary in "$package/ScreamerLauncher" "$package/dosbox"; do
          while read -r libpath; do
            case "$(basename "$libpath")" in
              libSDL2*|libopus*|libogg*|libspeexdsp*|libpng*|libz-ng*)
                cp -L "$libpath" "$package/lib/"
                ;;
            esac
          done < <(ldd "$binary" | awk '/=> \// {print $3}')
          patchelf --set-rpath '$ORIGIN/lib' "$binary"
        done
        (cd dist && zip -r "${name}-linux-x86_64.zip" "${name}-linux-x86_64")
        "$REA_SDK/packaging/appimage-wine.sh" --native --app screamer --exe ScreamerLauncher \
          --icon packaging/appimage/screamer-launcher.png \
          --desktop packaging/appimage/screamer-launcher.desktop \
          --payload dosbox --payload lib --optional-payload resources \
          --env-path SCREAMER_DOSBOX=dosbox --cache "$REA_CACHE" \
          --name "$name" "$package" dist
      package-dir: dist/ScreamerLauncher-*-linux-x86_64.zip
      package-allowlist: packaging/package.allow
      artifact-name: ScreamerLauncher-linux
      artifact-paths: |
        dist/*.zip
        dist/*.AppImage

  # The Windows build's tests, run headless under Wine (ScreamerLauncher.exe
  # and its tests crashed before main when linked with GNU ld 2.47; see
  # .cargo/config.toml).
  windows-tests:
    name: Windows x86_64 tests (Wine)
    uses: akitaonrails/rea-launcher-sdk/.github/workflows/launcher-ci.yml@v0.3.0
    with:
      concurrency-key: windows-tests
      rust-toolchain: 1.95.0
      rust-target: x86_64-pc-windows-gnu
      apt-packages: >-
        gcc-mingw-w64-x86-64 lld pkg-config libwayland-dev libxkbcommon-dev
      wine-tests: true
      wine-test-args: --locked --workspace
      # The Linux job runs these.
      audit: false
      sdk-check: false
      shell-tests: ""

  windows-packages:
    name: Windows x86_64
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-lld
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-ntldd
            mingw-w64-x86_64-opusfile
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-rust
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-speexdsp
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-zlib
            zip
      - name: Build launcher and bundled DOSBox
        run: |
          rustc --version
          cargo build --release --workspace --locked
          git -C vendor/dosbox-staging apply ../../patches/dosbox-staging-screamer-hooks.patch
          meson setup target/dosbox-staging-build vendor/dosbox-staging \
            -Dbuildtype=release \
            -Ddefault_library=shared \
            -Dtry_static_libs=iir \
            -Duse_sdl2_net=false \
            -Duse_mt32emu=false \
            -Duse_slirp=false \
            -Duse_fluidsynth=false \
            -Duse_zlib_ng=false \
            -Dunit_tests=disabled
          ninja -C target/dosbox-staging-build dosbox.exe
      - name: Package Windows zip
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' crates/screamer-launcher/Cargo.toml | head -1)"
          name="ScreamerLauncher-v${version}"
          package="$PWD/dist/${name}-windows-x86_64"
          mkdir -p "$package"
          (cd vendor/dosbox-staging && scripts/create-package.sh -p msys2 -f \
            "$OLDPWD/target/dosbox-staging-build" "$package")
          cp target/release/ScreamerLauncher.exe \
             README.md CHANGELOG.md THIRD_PARTY.md LICENSE-MIT LICENSE-APACHE "$package/"
          (
            set +o pipefail
            ntldd -R "$package/ScreamerLauncher.exe" \
              | sed -e 's/^[[:blank:]]*//g' \
              | cut -d ' ' -f 3 \
              | grep -E -i '(mingw|clang)(32|64)' \
              | sed -e 's|\\|/|g' \
              | {
                  copy_status=0
                  while IFS= read -r dll; do
                    cp "$dll" "$package/" || copy_status=$?
                  done
                  exit "$copy_status"
                }
          )
          (cd dist && zip -r "${name}-windows-x86_64.zip" "${name}-windows-x86_64")
          echo "WINDOWS_ZIP=dist/${name}-windows-x86_64.zip" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ScreamerLauncher-windows
          path: ${{ env.WINDOWS_ZIP }}
          if-no-files-found: error

  source-archive:
    name: Corresponding source
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - name: Create recursive source archive
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' crates/screamer-launcher/Cargo.toml | head -1)"
          name="ScreamerLauncher-v${version}-source"
          mkdir -p dist
          tar --exclude-vcs --exclude='./target' --exclude='./dist' \
            --transform="s,^\./,${name}/," -cJf "dist/${name}.tar.xz" .
          echo "SOURCE_TAR=dist/${name}.tar.xz" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ScreamerLauncher-source
          path: ${{ env.SOURCE_TAR }}
          if-no-files-found: error

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-packages, windows-packages, source-archive]
    # Granted even when unused: GitHub checks a called workflow's job
    # permissions before its `if:`.
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: akitaonrails/rea-launcher-sdk/.github/workflows/launcher-release.yml@v0.3.0
    with:
      package: screamer-launcher
      artifact-pattern: ScreamerLauncher-*
      # GitHub's generated notes, as before.
      notes: generate
      runs-on: ubuntu-22.04
